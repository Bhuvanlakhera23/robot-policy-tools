[metadata]
name = robot-policy-tools
version = 0.1.0.dev0
description = Generic policy interface validation and offline robotics signal metrics
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
robot_policy_tools = py.typed
